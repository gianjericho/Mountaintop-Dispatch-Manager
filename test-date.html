<script>
function parseSafeDate(dateStr) {
    if (!dateStr) return new Date(0);
    if (dateStr instanceof Date) return dateStr;
    let d = new Date(dateStr);
    if (!isNaN(d.getTime())) return d;
    if (typeof dateStr === 'string') {
        const parts = dateStr.split(/[-/]/);
        if (parts.length === 3) {
            if (parts[0].length === 4) return new Date(`${parts[0]}-${parts[1]}-${parts[2]}`);
            let p1 = parseInt(parts[0], 10), p2 = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
            if (p1 > 12) { let t = p1; p1 = p2; p2 = t; }
            d = new Date(`${y}-${p1}-${p2}`);
        }
    }
    return isNaN(d.getTime()) ? new Date(0) : d;
}

function isSameDay(d1, d2) { 
    if (!d1 || !d2) return false; 
    const date1 = parseSafeDate(d1); 
    const date2 = parseSafeDate(d2); 
    return date1.getFullYear() === date2.getFullYear() && date1.getMonth() === date2.getMonth() && date1.getDate() === date2.getDate(); 
}

console.log(isSameDay('5/11/2026', new Date()));
console.log(isSameDay('5/11/2026', new Date().toLocaleDateString()));
</script>
